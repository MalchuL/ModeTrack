version: '3.8'

services:
  backend:
    build: ./packages/backend
    container_name: productivity-backend
    ports:
      - "8000:8000"
    volumes:
      - ./packages/backend/data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/productivity.db
      - CORS_ORIGINS=["http://localhost:3000"]
    restart: always

  frontend:
    build: ./packages/frontend
    container_name: productivity-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: always

